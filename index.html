<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Love Roses ❤️</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  font-family: Arial, sans-serif;
  color: white;
  background: radial-gradient(circle, #4a1237, #10051b);
}

.card {
  padding: 25px;
  width: 92%;
  max-width: 400px;
  border: 1px solid #ff91c8;
  border-radius: 25px;
  background: #ffffff12;
  box-shadow: 0 0 30px #ff4fa455;
  position: relative;
  z-index: 2;
}

h1 { color: #ff9acb; }

.roses {
  font-size: 65px;
  margin: 20px 0;
  animation: pulse 1.5s infinite;
}

button {
  padding: 13px 25px;
  border: none;
  border-radius: 30px;
  background: linear-gradient(45deg, #ff1744, #ff69b4);
  color: white;
  font-size: 18px;
  cursor: pointer;
}

#message {
  display: none;
  margin-top: 20px;
  line-height: 1.9;
  color: #ffd6e9;
}

.heart {
  position: absolute;
  bottom: -40px;
  animation: float 7s linear forwards;
  pointer-events: none;
}

@keyframes pulse {
  50% { transform: scale(1.12); }
}

@keyframes float {
  to {
    transform: translateY(-110vh) rotate(360deg);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="card">
  <h1>🌹 باقة حب 💗</h1>

  <div class="roses">🌹 🌷</div>

  <p>وردة حمرا ووردة وردية، وكل واحدة بتحمل حكاية جميلة ❤️</p>

  <button onclick="showLove()">افتح رسالتك 💌</button>

  <div id="message">
    <h2>🌹 رسالة جميلة 🌷</h2>
    <p>أتمنى لك أيامًا مليئة بالفرح والابتسامات، وقلبًا لا يعرف إلا السعادة 💖</p>
    <p>❤️ 🌹 💗 🌷 ❤️</p>
  </div>
</div>

<script>
function showLove() {
  document.getElementById("message").style.display = "block";

  for (let i = 0; i < 25; i++) {
    setTimeout(createHeart, i * 100);
  }
}

function createHeart() {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.textContent = ["❤️", "💗", "💕", "🌹", "🌷"][
    Math.floor(Math.random() * 5)
  ];

  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = (18 + Math.random() * 25) + "px";
  heart.style.animationDuration = (4 + Math.random() * 4) + "s";

  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 8000);
}

setInterval(createHeart, 500);
</script>

</body>
  </html>
